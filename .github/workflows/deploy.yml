name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [v2.1]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2.1/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: v2.1

      - name: Convert policies images (PNG/JPG → WebP)
        run: npm run convert:policies
        working-directory: v2.1

      - name: Build
        run: npx next build
        working-directory: v2.1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2.1/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
